publishToMavenLocal.dependsOn jar

// module access required by dependencies, see the jar manifest and forked JVMs below.
def moduleOpens = [
        'java.base/java.util',                          // cqengine: kryo serialization for disk persistence.
        'java.base/java.lang',                          // hazelcast
        'java.base/sun.nio.ch',                         // hazelcast
        'java.management/sun.management',               // hazelcast
        'jdk.management/com.sun.management.internal'    // hazelcast
]
def moduleExports = [
        'java.base/jdk.internal.ref'                    // hazelcast
]

jar {
    /*from {
        (configurations.runtime).collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }*/
    manifest {
        attributes 'Implementation-Title': 'chili-core',
                'Implementation-Version': project.version,
                'Main-Class': 'com.codingchili.core.Launcher',
                'Add-Opens': moduleOpens.join(' '),
                'Add-Exports': moduleExports.join(' '),
                // jline uses the FFM api for terminal access.
                'Enable-Native-Access': 'ALL-UNNAMED',
                // jline exec terminal provider mutates ProcessBuilder internals.
                'Enable-Final-Field-Mutation': 'ALL-UNNAMED'
    }
}

// the manifest attributes only apply when launched with java -jar, so pass them to tests/JavaExec too.
tasks.withType(JavaForkOptions).configureEach {
    jvmArgs moduleOpens.collectMany { ['--add-opens', "$it=ALL-UNNAMED".toString()] }
    jvmArgs moduleExports.collectMany { ['--add-exports', "$it=ALL-UNNAMED".toString()] }
    jvmArgs '--enable-native-access=ALL-UNNAMED', '--enable-final-field-mutation=ALL-UNNAMED'
    // hazelcast (shaded jctools) uses sun.misc.Unsafe, there is no manifest attribute for this.
    jvmArgs '--sun-misc-unsafe-memory-access=allow'
}

// runs the storage benchmarks and writes an HTML report to build/benchmarks, e.g. gradlew benchmark -Piterations=5000
tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs the core storage benchmarks and writes an HTML report to build/benchmarks.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.codingchili.core.Launcher'
    // gradlew benchmark -Psuite=protocol: maps (default), protocol or all. iterations: protocol iterations are batches of 100,000 calls.
    args 'benchmark', '--html', '--iterations', providers.gradleProperty('iterations').getOrElse('1000'),
            '--suite', providers.gradleProperty('suite').getOrElse('maps')
    // print the report path instead of opening a browser.
    systemProperty 'java.awt.headless', 'true'
    def output = layout.buildDirectory.dir('benchmarks')
    workingDir = output
    doFirst { output.get().asFile.mkdirs() }
}

task sourcesJar(type: Jar) {
    archiveClassifier.set("sources")
    from sourceSets.main.allSource
}

test {
    // if the tests needs more than this there's a memory leak.
    maxHeapSize = "512m"
    // reports are not opened in a browser by the tests.
    systemProperty 'java.awt.headless', 'true'
    reports {
        junitXml.required = false
        html.required = true
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifact tasks.sourcesJar
            artifact rootProject.tasks.javadocJar
        }
    }
}

dependencies {
    // Exclude Jackson 2.x from all Vert.x dependencies to enable Jackson 3.x support
    api('io.vertx:vertx-core:5.2.0') {
        exclude group: 'com.fasterxml.jackson.core'
    }
    api('io.vertx:vertx-web:5.2.0') {
        exclude group: 'com.fasterxml.jackson.core'
    }

    /* native QUIC (quiche + BoringSSL) for the QuicListener, vert.x declares it optional. keep in sync with
     * the netty version used by vert.x (gradlew :core:dependencies | grep netty-codec-classes-quic). */
    ['linux-x86_64', 'linux-aarch_64', 'osx-x86_64', 'osx-aarch_64', 'windows-x86_64'].each { platform ->
        runtimeOnly("io.netty:netty-codec-native-quic:4.2.18.Final:${platform}")
    }

    implementation('io.dropwizard.metrics:metrics-jvm:4.2.40')

    // Jackson 3.x dependencies
    implementation 'tools.jackson.core:jackson-core:3.2.3'
    implementation 'tools.jackson.core:jackson-databind:3.2.3'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.2'
    implementation 'tools.jackson.dataformat:jackson-dataformat-yaml:3.2.3'
    implementation 'tools.jackson.module:jackson-module-blackbird:3.2.3'


    implementation('io.vertx:vertx-hazelcast:5.2.0') {
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation('io.vertx:vertx-mongo-client:5.2.0') {
        exclude group: 'com.fasterxml.jackson.core'
    }
    implementation('io.vertx:vertx-dropwizard-metrics:5.2.0') {
        exclude group: 'com.fasterxml.jackson.core'
    }

    implementation('de.neuland-bfi:jade4j:1.3.2')
    implementation('de.mkammerer:argon2-jvm:2.12')
    implementation('org.jline:jline:4.4.6')

    implementation('org.elasticsearch.client:elasticsearch-rest-high-level-client:7.17.29')
    implementation('com.googlecode.cqengine:cqengine:3.6.0')

    /* keep these in sync with cqengine, used internally. */
    implementation('com.esotericsoftware:kryo:5.2.0')

    /* used by dropwizard metrics, routed to the ConsoleLogger by logging.Slf4jServiceProvider. */
    implementation('org.slf4j:slf4j-api:2.0.17')

    testImplementation 'io.vertx:vertx-unit:5.2.0'
    testImplementation 'junit:junit:4.13.2'
}
